<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente</title>
  <style>
    :root { --bg: #0b0d10; --panel: #111419; --line: #1e232b; --text: #d7dce3; --muted: #7b8594; --accent: #6ea8fe; --ok: #5ccf95; --warn: #e7b45a; --err: #ef6f6c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 16px; gap: 12px; }
    header { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 12px; }
    #clock { font: 200 22px "Segoe UI Variable Display", "Segoe UI", sans-serif; color: var(--text); font-variant-numeric: tabular-nums; }
    a { color: var(--muted); }
    #orb { align-self: center; width: 128px; height: 128px; border-radius: 50%; border: 1px solid var(--line); background: radial-gradient(circle at 50% 40%, #1a2230, var(--panel)); color: var(--text); font-size: 40px; cursor: pointer; transition: box-shadow .3s, border-color .3s; margin-top: 6px; }
    #orb:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    body[data-s=ouvindo] #orb { border-color: var(--err); box-shadow: 0 0 0 8px #ef6f6c22, 0 0 40px #ef6f6c55; animation: pulse 1.2s infinite; }
    body[data-s=pensando] #orb { border-color: var(--accent); box-shadow: 0 0 40px #6ea8fe55; }
    body[data-s=falando] #orb { border-color: var(--ok); box-shadow: 0 0 40px #5ccf9555; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 16px #ef6f6c11, 0 0 50px #ef6f6c66; } }
    @media (prefers-reduced-motion: reduce) { #orb { animation: none !important; transition: none; } }
    #state { text-align: center; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
    #heard { text-align: center; color: var(--muted); font-style: italic; min-height: 1.5em; }
    #log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
    .say { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; }
    .act { color: var(--muted); font: 12px "Cascadia Code", Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .act.err, .error { color: var(--err); }
    .ask { border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; background: #1a1610; }
    .ask pre { white-space: pre-wrap; font-size: 11.5px; margin: 6px 0; max-height: 120px; overflow: auto; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; background: var(--accent); color: var(--bg); }
    button.no { background: transparent; color: var(--err); border: 1px solid var(--err); }
    footer { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
    select, input[type=text] { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; }
    input[type=text] { flex: 1; min-width: 0; }
    label { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  </style>
</head>
<body data-s="parado">
  <header><span id="clock">--:--</span><a href="/" target="_blank">abrir central</a></header>
  <button id="orb" aria-label="Falar (atalho: espaço)" title="Falar (espaço)">🎙</button>
  <div id="state">parado</div>
  <div id="heard"></div>
  <div id="log"></div>
  <form id="f"><footer>
    <select id="agent" aria-label="Agente"></select>
    <label title="Diga o nome para ativar"><input type="checkbox" id="cont"> ativar por “<span id="wakeName">Brow</span>”</label>
    <input type="text" id="txt" placeholder="ou digite…" aria-label="Comando por texto">
  </footer></form>
  <script src="/voz.js"></script>
</body>
</html>
